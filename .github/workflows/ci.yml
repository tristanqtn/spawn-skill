name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Without the binary, check.sh skips the half that matters -- whether the tools
      # this skill describes actually exist. So build spawn from the main repo and let
      # the real tools/list answer.
      - uses: actions/checkout@v4
        with:
          repository: tristanqtn/spawn
          path: .spawn-src
      - uses: actions/setup-go@v5
        with:
          go-version-file: .spawn-src/go.mod
      - name: build spawn
        run: |
          cd .spawn-src
          go build -o /usr/local/bin/spawn .
          spawn version

      # `spawn mcp` refuses to serve when either dependency is missing, so without nix
      # on the runner the tool-name check silently degrades to nothing. podman is
      # preinstalled on ubuntu-latest; nix is not.
      - uses: cachix/install-nix-action@v31
      - name: the runtime deps spawn mcp insists on
        run: |
          podman --version
          nix --version

      - name: check the skill
        run: ./check.sh
